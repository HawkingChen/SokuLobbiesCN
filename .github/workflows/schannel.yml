name: Schannel test build
on:
  workflow_dispatch:
  push:
    branches: [schannel-test]
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Fetch client dependencies
        run: git submodule update --init src/SokuMod/SokuLib src/SokuMod/curl
      - name: Configure Schannel transport wrapper
        run: cmake -S schannel-wrapper -B build-wrapper -A Win32 -DCMAKE_POLICY_VERSION_MINIMUM=3.5
      - name: Build transport wrapper and test
        run: cmake --build build-wrapper --config Release --parallel 4
      - name: Download verified official lobby
        shell: pwsh
        run: |
          Invoke-WebRequest 'https://github.com/soku-cn/SokuLobbiesMod/releases/download/v0.7.6.3/SokuLobbiesMod_0.7.6.3.zip' -OutFile official.zip
          Expand-Archive official.zip official
          $dll = @(Get-ChildItem official -Recurse -Filter SokuLobbiesMod.dll)
          if ($dll.Count -ne 1) { throw 'Expected exactly one official DLL' }
          if ((Get-FileHash $dll[0].FullName -Algorithm SHA256).Hash.ToLower() -ne '3f7e979bda4c9e21fcf6b720be6eac6bdc45821163e8e0f31f718d3e7e03cb9a') { throw 'Official DLL hash differs; do not install' }
          Copy-Item $dll[0].FullName build-wrapper/Release/SokuLobbiesMod.dll
      - name: Exercise the original DLL network API through Schannel
        shell: pwsh
        run: |
          Push-Location build-wrapper/Release
          ./LobbySchannelTest.exe "$pwd/SokuLobbiesMod.dll"
          if ($LASTEXITCODE -ne 0) { throw 'Original API network test failed' }
          Pop-Location
      - name: Reject an unverified DLL
        shell: pwsh
        run: |
          Push-Location build-wrapper/Release
          $bytes = [IO.File]::ReadAllBytes("$pwd/SokuLobbiesMod.dll")
          $bytes[1024] = $bytes[1024] -bxor 1
          [IO.File]::WriteAllBytes("$pwd/altered.dll", $bytes)
          ./LobbySchannelTest.exe "$pwd/altered.dll"
          if ($LASTEXITCODE -ne 10) { throw 'Unverified DLL was not rejected' }
          Pop-Location
          exit 0
      - name: Prepare test files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifact | Out-Null
          Copy-Item build-wrapper/Release/LobbySchannel.dll artifact/
          Copy-Item build-wrapper/Release/LobbySchannelTest.exe artifact/
          Copy-Item build-wrapper/Release/SokuLobbiesMod.dll artifact/
          Copy-Item build-wrapper/Release/Schannel-transport.log artifact/
          Copy-Item SCHANNEL-TEST.md artifact/
          Copy-Item LICENSE artifact/
          git rev-parse HEAD | Set-Content artifact/source-commit.txt
          Get-ChildItem artifact -Filter *.dll | Get-FileHash -Algorithm SHA256 | Format-List | Out-File artifact/SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: SokuLobbiesCN-Schannel-official-wrapper
          path: artifact/
          if-no-files-found: error
          retention-days: 14
